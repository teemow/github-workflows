# Reusable GoReleaser release on a v* tag. Call from a repo's release
# workflow:
#
#   on:
#     push:
#       tags: ['v*']
#   permissions:
#     contents: write
#     id-token: write
#   jobs:
#     release:
#       uses: teemow/github-workflows/.github/workflows/release-go.yml@main
#
# NOTE: tags created by the auto-release workflow are pushed with
# GITHUB_TOKEN, and GitHub suppresses `push: tags` triggers for those. Repos
# using auto-release must instead CHAIN this workflow off the release job and
# pass the tag explicitly:
#
#   jobs:
#     release:
#       uses: teemow/github-workflows/.github/workflows/auto-release.yml@main
#     goreleaser:
#       needs: release
#       if: needs.release.outputs.tag != ''
#       uses: teemow/github-workflows/.github/workflows/release-go.yml@main
#       with:
#         tag: ${{ needs.release.outputs.tag }}
#       permissions:
#         contents: write
#         id-token: write
#
# Every release asset is signed with cosign, keyless: the job's OIDC token
# (hence id-token: write, which callers must grant too) identifies this
# workflow to Fulcio, and GoReleaser publishes a Sigstore bundle next to
# each asset when the repo's .goreleaser.yaml has a `signs` entry such as
#
#   signs:
#     - cmd: cosign
#       signature: '${artifact}.bundle'
#       args: ['sign-blob', '--yes', '--bundle=${signature}', '${artifact}']
#       artifacts: all
#
# The certificate then carries this workflow as the subject
# (https://github.com/teemow/github-workflows/.github/workflows/release-go.yml@refs/heads/main),
# https://token.actions.githubusercontent.com as the issuer, and the calling
# repository as the source repository -- which is what a self-updating CLI
# pins when it verifies a download.
#
# Runs on GitHub-hosted ubuntu-latest -- GoReleaser cross-compiles, needs no
# repo-specific runner, and shouldn't wait for a cold ARC pod.
name: release-go

on:
  workflow_call:
    inputs:
      tag:
        description: >-
          Tag to release. Required when chained off auto-release (the ref that
          triggered the run is the branch, not the tag); defaults to the
          triggering ref for plain `push: tags` callers.
        required: false
        type: string
        default: ""
      working-directory:
        description: Directory containing go.mod and the GoReleaser config
        required: false
        type: string
        default: "."

permissions:
  contents: write
  id-token: write # keyless cosign signing of the release assets

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Empty ref = the triggering ref (plain `push: tags` callers).
          # Chained callers pass the freshly created tag explicitly because
          # their triggering ref is the branch, not the tag.
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      # GoReleaser resolves the version from the tag reachable at HEAD; when
      # chained, HEAD is the tagged commit checked out above. keep-existing
      # (goreleaser's default release mode) attaches artifacts to the release
      # auto-release already created instead of clobbering its notes.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          workdir: ${{ inputs.working-directory }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
