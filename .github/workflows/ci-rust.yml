# Reusable Rust CI: fmt, clippy, test.
name: ci-rust

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label (per-repo ARC scale set)
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: rust
    runs-on: ${{ inputs.runs-on }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test
